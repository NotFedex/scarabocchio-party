name: Unpack Scarabocchio Party source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/part*.b64'
      - '.github/workflows/unpack.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate source archive
        run: |
          cat bootstrap/part*.b64 | base64 --decode > /tmp/scarabocchio-party.zip
          unzip -t /tmp/scarabocchio-party.zip
          mkdir -p /tmp/source
          unzip -q /tmp/scarabocchio-party.zip -d /tmp/source
          cp -a /tmp/source/scarabocchio-party/. .
          rm -rf bootstrap
      - name: Commit application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Scarabocchio Party v1.1.0 source"
            git push
          fi
